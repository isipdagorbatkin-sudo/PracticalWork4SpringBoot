<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить блюдо</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { background: #fff3e0; padding: 15px; border-radius: 6px; max-width: 600px; }
        label { display: block; margin-top: 10px; }
        input, select { padding: 5px; width: 100%; }
        button { margin-top: 15px; padding: 6px 14px; background-color: #ff9800; color: white; border: none; border-radius: 3px; }
        a { display: inline-block; margin-top: 10px; color: #ff9800; text-decoration: none; }
    </style>
</head>
<body>
<h2>Добавить блюдо</h2>
<form action="/menuItems" method="post" th:object="${menuItem}">
    <label>Название:
        <input type="text" th:field="*{name}" required>
    </label>
    <label>Описание:
        <input type="text" th:field="*{description}">
    </label>
    <label>Цена:
        <input type="number" step="0.01" th:field="*{price}" required>
    </label>
    <label>Доступно:
        <input type="checkbox" th:field="*{available}">
    </label>
    <label>Ссылка на изображение:
        <input type="text" th:field="*{imageUrl}">
    </label>
    <label>Категория:
        <select name="categoryId" required>
            <option value="" disabled selected>Выберите категорию</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.idCategory}"
                    th:text="${cat.name}">
            </option>
        </select>
    </label>
    <button type="submit">Сохранить</button>
</form>
<a href="/menuItems">Назад к списку</a>
</body>
</html>
